name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            runner: ubuntu-24.04
            label: linux-amd64
          - target: linux/arm64
            runner: ubuntu-24.04-arm
            label: linux-arm64
          - target: darwin/amd64
            runner: macos-15-intel
            label: darwin-amd64
          - target: darwin/arm64
            runner: macos-14
            label: darwin-arm64
          - target: windows/amd64
            runner: windows-2022
            label: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Set up Windows C++ build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Download matching prebuilt V8
        shell: bash
        run: go run ./tools/fetch.go -target '${{ matrix.target }}'
      - name: Build Windows bridge DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build-windows.ps1 -SkipFetch
      - name: Test and build
        shell: bash
        run: |
          go test -count=1 ./...
          go vet ./...
          go build ./cmd/demo ./cmd/lowlevel
      - name: Package source and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-stage
          git archive HEAD | tar -xf - -C release-stage
          cp -R deps release-stage/deps
          tar -czf 'gone_v8-${{ matrix.label }}.tar.gz' -C release-stage .
      - uses: actions/upload-artifact@v4
        with:
          name: gone_v8-${{ matrix.label }}
          path: gone_v8-${{ matrix.label }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
