name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            runner: ubuntu-24.04
            label: linux-amd64
          - target: linux/arm64
            runner: ubuntu-24.04-arm
            label: linux-arm64
          - target: darwin/amd64
            runner: macos-15-intel
            label: darwin-amd64
          - target: darwin/arm64
            runner: macos-14
            label: darwin-arm64
          - target: windows/amd64
            runner: windows-2022
            label: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          # Go's cgo cache does not detect changes to external native libraries.
          # Include the pinned V8 manifest and bridge headers in the cache key.
          cache: true
          cache-dependency-path: |
            go.mod
            get_libs/get_libs.go
            lowlevel/*.h
            lowlevel/*.cc
            lowlevel/native_unix.go
      - name: Set up Windows C++ build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Download matching prebuilt V8
        shell: bash
        run: go run ./tools/fetch.go -target '${{ matrix.target }}'
      - name: Build Windows bridge DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build-windows.ps1 -SkipFetch
      - name: Build release demos
        shell: bash
        run: |
          mkdir -p bin
          suffix=''
          if [ '${{ runner.os }}' = 'Windows' ]; then suffix='.exe'; fi
          go build -o "bin/demo${suffix}" ./cmd/demo
          go build -o "bin/lowlevel${suffix}" ./cmd/lowlevel
          if [ '${{ runner.os }}' = 'Windows' ]; then cp deps/windows_amd64/gone_v8.dll bin/; fi
      - name: Package source and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-stage
          git archive HEAD | tar -xf - -C release-stage
          # Avoid copying the large static library; use fast compression.
          tar -cf - -C release-stage . -C "$(pwd)" deps bin | gzip -1 > 'gone_v8-${{ matrix.label }}.tar.gz'
      - uses: actions/upload-artifact@v4
        with:
          name: gone_v8-${{ matrix.label }}
          path: gone_v8-${{ matrix.label }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
